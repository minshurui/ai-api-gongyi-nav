<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI API 公益站导航 · 免费池</title>
<meta name="description" content="AI API 公益站与中转站导航，GPT/Claude/DeepSeek/GLM 免费额度检索">
<style>
:root{--ink:#16231f;--muted:#617069;--line:#dce5df;--paper:#fbfcfb;--panel:#fff;--green:#12805c;--blue:#2457a6;--amber:#c97920;--red:#b0443e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--panel)}
.bar input{flex:1;min-width:180px}
.bar select{min-width:120px}
.stats{font-size:13px;color:var(--muted);margin-bottom:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04)}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{background:#f0f5f1;font-weight:600;color:var(--muted);position:sticky;top:0}
td a{color:var(--blue);text-decoration:none}
td a:hover{text-decoration:underline}
.tag{display:inline-block;background:#e8f3ee;color:var(--green);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
.bd{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;margin:1px;white-space:nowrap}
.bd.ok{background:#e0f2e9;color:var(--green)}
.bd.dead{background:#fbe4e2;color:var(--red)}
.bd.bonus{background:#fdf0dc;color:var(--amber)}
.bd.mine{background:#e8eefb;color:var(--blue)}
.tag.inv{background:#fef3e8;color:var(--amber)}
.tag.claude{background:#eef2fb;color:var(--blue)}
.name{font-weight:600}
.note{color:var(--muted);font-size:12px;margin-top:2px}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:600px){.wrap{padding:12px}th,td{padding:7px;font-size:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>🆓 AI API 公益站导航</h1>
<div class="sub">免费 Claude/GPT/DeepSeek/GLM 中转站聚合 · 邀请返利滚动额度池</div>
<div class="bar">
  <input id="q" placeholder="搜站名/模型/标签…" oninput="render()">
  <select id="f" onchange="render()"><option value="">全部分类</option></select>
  <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap"><input type="checkbox" id="showDead" onchange="render()" style="margin:0">显示已失效站</label>
</div>
<noscript><div style="padding:12px;border:1px solid #dce5df;border-radius:8px;background:#fff;margin:12px 0;font-size:13px">
<h2>AI API 公益站导航 · 免费额度一览（2026-08-31 实测）</h2>
<p>收录 GPT、Claude、Codex、DeepSeek、GLM、Gemini 等模型中转站与公益站。21 站实测可用，注册送额度最高 200 刀。</p>
<p><strong>实测可用：</strong>helpcoder.cc（注册送$200）、agentrouter.org、api.aiaiai001.com、api.aisz.mom、api.bybing.cc（送$0.5）、api.code-relay.com、api.justwoker.icu、api.uu6.top（送$1）、api.yunhe.one（送$0.5）、cli.999554.xyz（送$1）、dawclaudecode.com、freeapi.dgbmc.top、jianzhile.vip、jucodex.com、kapibala.asia、moyuu.cc、straitapi.com、sudoflow.top、superapi.buzz、vsllm.com、newapi.makelove.cloud</p>
<p>更多站点与实时筛选请用支持 JavaScript 的浏览器打开本页。</p>
</div></noscript>
<div class="stats" id="stats"></div>
<div id="tbl"></div>
<footer>公益站导航 · 自部署 · 额度请自行确认 · 不上传隐私</footer>
</div>
<script>
let SITES=[],CATS=new Set();
const $=id=>document.getElementById(id);
fetch('data/sites.json').then(r=>r.json()).then(d=>{
  SITES=Array.isArray(d)?d:(d.sites||d.data||[]);
  return fetch('data/health.json').then(r=>r.ok?r.json():{sites:{}}).catch(()=>({sites:{}})).then(h=>{HEALTH=h.sites||{};TESTED=h.tested_date||''});
}).then(()=>{
  SITES.forEach(s=>(s.tags||[]).forEach(t=>CATS.add(t)));
  [...CATS].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('f').appendChild(o)});
  render();
});
let HEALTH={},TESTED='';
function hof(s){return HEALTH[s.domain]||{}}
function badge(s){
  const h=hof(s);let b='';
  if(h.status==='alive')b+='<span class="bd ok">✓实测可用</span>';
  else if(h.status==='dead')b+='<span class="bd dead">✗已失效</span>';
  if(h.bonus&&h.bonus!=='$0')b+=`<span class="bd bonus">💰注册送${h.bonus}</span>`;
  if(h.mine)b+='<span class="bd mine">⭐亲测邀请</span>';
  return b;
}
function tags(s){return (s.tags||[]).map(t=>`<span class="tag${/邀请|邀/.test(t)?' inv':/claude/i.test(t)?' claude':''}">${t}</span>`).join(' ')}
function render(){
  const q=$('q').value.toLowerCase(),f=$('f').value,showDead=$('showDead').checked;
  const list=SITES.filter(s=>{
    const okq=!q||(s.name+' '+s.note+' '+(s.tags||[]).join(' ')).toLowerCase().includes(q);
    const okf=!f||(s.tags||[]).includes(f);
    const okd=showDead||hof(s).status!=='dead';
    return okq&&okf&&okd;
  });
  const na=SITES.filter(s=>hof(s).status==='alive').length,nd=SITES.filter(s=>hof(s).status==='dead').length;
  $('stats').textContent=`${na} 站实测可用 · ${nd} 站已失效 · 共 ${SITES.length} 站 · 实测 ${TESTED} · 筛选 ${list.length}`;
  if(!list.length){$('tbl').innerHTML='<div class="empty">无匹配</div>';return}
  $('tbl').innerHTML=`<table><thead><tr><th>#</th><th>站点</th><th>状态</th><th class="hide-sm">标签</th><th>备注</th></tr></thead><tbody>${
  list.map((s,i)=>{const h=hof(s),dim=h.status==='dead'?' style="opacity:.45"':'';return `<tr${dim}><td>${SITES.indexOf(s)+1}</td><td class="name"><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a><div class="note">${s.domain}</div></td><td>${badge(s)}</td><td class="hide-sm">${tags(s)}</td><td><div>${s.note||''}</div></td></tr>`}).join('')
  }</tbody></table>`;
}
</script>
</body>
</html>
